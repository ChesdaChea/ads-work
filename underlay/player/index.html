<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie 300x600 Ad</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* 🎯 Ad container */
        .banner {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            /* align-items: center; */
            /* justify-content: center; */
        }

        .mute-button {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 42px;
      height: 42px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mute-button img {
      width: 28px;
      height: 28px;
      display: block;
    }
    </style>

    

    <script>
        var clickTag = "https://www.facebook.com/share/1DMw4kg5bx/?mibextid=wwXIfr";
    </script>

</head>

<body>

    <div class="banner" onclick="window.open(clickTag,'_blank')">

        <video id="video" autoplay loop muted playsinline defaultmuted preload="auto" width="100%">
            <source src="./images/Comp 1-3.mp4" type="video/mp4" />
        </video>
    </div>

    <button
          class="mute-button"
          id="muteButton"
          type="button"
          aria-label="Unmute video">
          <img
            id="muteIcon"
            src="https://thestreetnews.sgp1.digitaloceanspaces.com/adsvideo/mute.png"
            alt="Mute">
    </button>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const video = document.getElementById("video");
        const muteButton = document.getElementById("muteButton");
        const muteIcon = document.getElementById("muteIcon");

        if (!video || !muteButton || !muteIcon) return;

        muteButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();

          video.muted = !video.muted;
          muteIcon.src = video.muted
            ? "https://thestreetnews.sgp1.digitaloceanspaces.com/adsvideo/mute.png"
            : "https://thestreetnews.sgp1.digitaloceanspaces.com/adsvideo/unmute.png";
          muteButton.setAttribute("aria-label", video.muted ? "Unmute video" : "Mute video");
        });

        video.play().catch(function (error) {
          console.log("Autoplay was prevented by browser:", error);
        });
      });
    </script>

</body>

</html>
